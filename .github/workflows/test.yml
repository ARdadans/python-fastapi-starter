name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: pip install -r requirements.txt

      - name: Install project
        run: pip install -e .

      - name: Install test dependencies
        run: pip install pytest pytest-asyncio httpx ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t python-fastapi-starter:test .

      - name: Run Docker container
        run: docker run -d --name python-fastapi-starter-test -p 8000:8000 python-fastapi-starter:test

      - name: Wait for application
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs python-fastapi-starter-test
          exit 1

      - name: Test Docker API
        run: curl --fail http://127.0.0.1:8000/

      - name: Docker logs
        if: always()
        run: docker logs python-fastapi-starter-test

      - name: Cleanup
        if: always()
        run: docker rm -f python-fastapi-starter-test
